name: Minecraft Harita Olusturucu

on:
  workflow_dispatch: # GitHub panelinden tek tıkla manuel başlatmak için

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Kopyala (Checkout)
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kutuphaneleri Yukle (Pillow & Requests)
        run: |
          python -m pip install --upgrade pip
          pip install requests Pillow

      - name: Harita Betigini Calistir
        run: python main.py

      - name: Olusan Haritayi Artifact Olarak Kaydet
        uses: actions/upload-artifact@v4
        with:
      - name: minecraft-full-map
          path: minecraft_full_map_minecraft_yeni_z5.png
